<!DOCTYPE html>
<html>
  <head>
    <title>One Fighters</title>
    <meta name="description" content="A Catalog of One Championship Fighters" />
    <link rel="stylesheet" href="style.css" />
    <script type="text/javascript" src="data/one_champion_fighters.js"></script>
    <script type="text/javascript" src="scripts.js"></script>
  </head>

  <body>
    <header class="main-header">
      <h1 class="title">One Fighters</h1>
      <details class="controls-dropdown">
        <summary class="settings-btn">Sort &amp; Filter</summary>
        <form class="controls-panel" aria-label="Sort and filter fighters">
          <label for="sort-by">Sort by</label>
          <select id="sort-by" name="sort-by" onchange="sortCards(this.value)">
            <option value="name-asc">Name (A-Z)</option>
            <option value="name-desc">Name (Z-A)</option>
            <option value="age-asc">Age (Low-High)</option>
            <option value="age-desc">Age (High-Low)</option>
            <option value="wins-desc">Wins (Most-Least)</option>
            <option value="wins-asc">Wins (Least-Most)</option>
          </select>

          <fieldset class="units-fieldset">
            <legend>Units</legend>
            <div class="metric-switch-row">
              <span class="metric-side metric-side-imperial">ft · lbs</span>
              <label class="metric-switch">
                <input
                  type="checkbox"
                  id="metric-units-switch"
                  class="metric-switch-input"
                  checked
                  role="switch"
                  aria-label="Use metric units: meters and kilograms"
                  onchange="toggleMetricUnits()"
                />
                <span class="metric-switch-track" aria-hidden="true">
                  <span class="metric-switch-thumb"></span>
                </span>
              </label>
              <span class="metric-side metric-side-metric">m · kg</span>
            </div>
          </fieldset>

          <fieldset>
            <legend>Weight Class</legend>
            <label
              ><input
                type="checkbox"
                name="weight-class"
                value="atomweight"
                onchange="updateFilters(this)"
              />
              Atomweight</label
            >
            <label
              ><input
                type="checkbox"
                name="weight-class"
                value="strawweight"
                onchange="updateFilters(this)"
              />
              Strawweight</label
            >
            <label
              ><input
                type="checkbox"
                name="weight-class"
                value="flyweight"
                onchange="updateFilters(this)"
              />
              Flyweight</label
            >
            <label
              ><input
                type="checkbox"
                name="weight-class"
                value="heavyweight"
                onchange="updateFilters(this)"
              />
              Heavyweight</label
            >
            <label
              ><input
                type="checkbox"
                name="weight-class"
                value="unknown"
                onchange="updateFilters(this)"
              />
              Unknown</label
            >
          </fieldset>

          <fieldset>
            <legend>Record</legend>
            <label
              ><input
                type="radio"
                name="record-filter"
                value="all"
                checked
                onchange="updateFilters(this)"
              />
              Show all</label
            >
            <label
              ><input
                type="radio"
                name="record-filter"
                value="winning"
                onchange="updateFilters(this)"
              />
              Winning record only</label
            >
            <label
              ><input
                type="radio"
                name="record-filter"
                value="undefeated"
                onchange="updateFilters(this)"
              />
              Undefeated only</label
            >
          </fieldset>
        </form>
      </details>
    </header>
    <div id="card-container"></div>
    <div class="card" style="display: none">
      <div class="card-content">
        <h2>Fighter Name</h2>
        <p class="nickname"><span>Nickname</span></p>
        <img src="" alt="Fighter Photo" />
        <ul>
          <li class="age">Age</li>
          <li class="country">Country</li>
          <li class="height">Height</li>
          <li class="weight">Weight</li>
          <li class="association">Association</li>
          <li class="weight-class">Weight Class</li>
          <li class="wins">Wins</li>
          <li class="losses">Losses</li>
        </ul>
        <a class="fighter-link" href="" target="_blank">View Fighter</a>
      </div>
    </div>
    <div class="footer">
      <button onclick="quoteAlert()">Get A Quote!</button>
      <button onclick="removeLastCard()">Remove A Card!</button>
    </div>
  </body>
</html>
