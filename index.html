<!DOCTYPE html>
<html>
  <head>
    <title>One Fighters</title>
    <meta name="description" content="A Catalog of One Championship Fighters" />
    <link rel="stylesheet" href="style.css" />
    <script type="text/javascript" src="data/one_champion_fighters.js"></script>
    <script type="text/javascript" src="scripts.js"></script>
  </head>

  <body>
    <header class="main-header">
      <h1 class="title">One Fighters</h1>
      <button class="settings-btn" type="button">Settings</button>
    </header>
    <div id="card-container"></div>
    <div class="card" style="display: none">
      <div class="card-content">
        <h2>Fighter Name</h2>
        <p class="nickname"><span>Nickname</span></p>
        <img src="" alt="Fighter Photo" />
        <ul>
          <li class="age">Age</li>
          <li class="country">Country</li>
          <li class="height">Height</li>
          <li class="weight">Weight</li>
          <li class="association">Association</li>
          <li class="weight-class">Weight Class</li>
          <li class="wins">Wins</li>
          <li class="losses">Losses</li>
        </ul>
        <a class="fighter-link" href="" target="_blank">View Fighter</a>
      </div>
    </div>
    <div class="footer">
      <button onclick="quoteAlert()">Get A Quote!</button>
      <button onclick="removeLastCard()">Remove A Card!</button>
    </div>
  </body>
</html>
